[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestion-camiones"
version = "0.1.16"
description = "Aplicacion de escritorio para gestion operativa de camiones."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "certifi>=2024.7.4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
gestion-camiones = "gestion_camiones.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gestion_camiones.assets" = ["*.xlsx"]
