name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact_name: GestionCamiones-Windows-x64.zip
            pyinstaller_target_arch: ""
          - label: macOS Apple Silicon
            os: macos-latest
            artifact_name: GestionCamiones-macOS-AppleSilicon.dmg
            pyinstaller_target_arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact_name: GestionCamiones-macOS-Intel.dmg
            pyinstaller_target_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Prepare Apple signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APP_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT }}
          APPLE_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APP_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: temporary-build-password
        run: |
          if [[ -z "$APPLE_DEVELOPER_ID_APP_CERT" || -z "$APPLE_DEVELOPER_ID_APP_CERT_PASSWORD" || -z "$APPLE_DEVELOPER_ID_APP_IDENTITY" ]]; then
            echo "No Apple signing secrets configured. Continuing without code signing."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_DEVELOPER_ID_APP_CERT" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_APP_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build app
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.pyinstaller_target_arch }}
        run: pyinstaller packaging/gestion-camiones.spec

      - name: Codesign macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APP_IDENTITY }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_ID_APP_IDENTITY" ]]; then
            echo "No Apple signing identity configured. Skipping app codesign."
            exit 0
          fi
          codesign --force --deep --options runtime --timestamp \
            --entitlements packaging/macos-entitlements.plist \
            --sign "$APPLE_DEVELOPER_ID_APP_IDENTITY" \
            dist/GestionCamiones.app
          codesign --verify --deep --strict --verbose=2 dist/GestionCamiones.app

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GestionCamiones -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: bash packaging/build_macos_dmg.sh dist/GestionCamiones.app ${{ matrix.artifact_name }}

      - name: Codesign macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APP_IDENTITY }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_ID_APP_IDENTITY" ]]; then
            echo "No Apple signing identity configured. Skipping DMG codesign."
            exit 0
          fi
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_ID_APP_IDENTITY" ${{ matrix.artifact_name }}
          codesign --verify --verbose=2 ${{ matrix.artifact_name }}

      - name: Notarize macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          if [[ -z "$APPLE_NOTARY_KEY_ID" || -z "$APPLE_NOTARY_ISSUER_ID" || -z "$APPLE_NOTARY_PRIVATE_KEY" ]]; then
            echo "No Apple notarization secrets configured. Skipping notarization."
            exit 0
          fi
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$AUTH_KEY_PATH"
          xcrun notarytool submit ${{ matrix.artifact_name }} \
            --key "$AUTH_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple ${{ matrix.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Attach artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
