name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Build app
        run: pyinstaller packaging/gestion-camiones.spec

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GestionCamiones -DestinationPath GestionCamiones-Windows.zip

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: zip -r GestionCamiones-macOS.zip dist/GestionCamiones

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionCamiones-${{ runner.os }}
          path: GestionCamiones-*.zip

      - name: Attach artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GestionCamiones-*.zip
          generate_release_notes: true
